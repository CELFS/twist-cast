name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      target:
        description: Build all packages and publish unpublished versions, or rebuild selected packages as workflow artifacts
        type: choice
        default: all
        options: [all, android, macos, android-arm64-v8a, android-armeabi-v7a, android-x86_64]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.50.0'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      android: ${{ steps.version.outputs.android }}
      macos: ${{ steps.version.outputs.macos }}
      publish: ${{ steps.release-policy.outputs.publish }}
      android_matrix: ${{ steps.version.outputs.android_matrix }}
      notices_abi: ${{ steps.version.outputs.notices_abi }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release configuration before allocating build jobs
        run: python3 tool/release.py check-inputs
      - id: version
        env:
          RELEASE_TARGET: ${{ inputs.target || 'all' }}
        run: python3 tool/release.py metadata
      - name: Decide whether this version needs publishing
        id: release-policy
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PUBLISH_REQUESTED: ${{ steps.version.outputs.publish }}
        run: python3 tool/release.py release-policy

  checks:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # This is the only Linux Flutter cache writer; Android jobs only restore it.
      - uses: ./.github/actions/flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          platform: ${{ needs.metadata.outputs.android == 'true' && 'android' || 'linux' }}
          write-cache: 'true'
      - name: Check release inputs, analyze, and test
        run: python3 tool/release.py preflight

  android-toolchain:
    needs: metadata
    if: needs.metadata.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
        with:
          prime: 'true'

  android:
    needs: [metadata, android-toolchain]
    if: needs.metadata.outputs.android == 'true'
    name: android (${{ matrix.abi }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.android_matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TWISTCAST_KEYSTORE_PATH: ${{ github.workspace }}/.secrets/twist-cast-release.jks
      TWISTCAST_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      TWISTCAST_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      TWISTCAST_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # CI-only settings keep local development resource usage unchanged.
      GRADLE_OPTS: -Dorg.gradle.caching=true -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore the dedicated release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          required = ['ANDROID_KEYSTORE_BASE64', 'TWISTCAST_STORE_PASSWORD',
                      'TWISTCAST_KEY_ALIAS', 'TWISTCAST_KEY_PASSWORD']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing signing secrets: ' + ', '.join(missing) + '. See docs/releases.md.')
          path = Path(os.environ['TWISTCAST_KEYSTORE_PATH'])
          path.parent.mkdir(mode=0o700, exist_ok=True)
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'].strip(), validate=True))
          path.chmod(0o600)
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: false
          cache-cleanup: never
      - uses: ./.github/actions/android-toolchain
        id: toolchain
      - uses: ./.github/actions/flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          platform: android
      - name: Check the pinned toolchain matches Flutter
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path('.github/android-toolchain.json').read_text())
          extension = (Path(os.environ['FLUTTER_ROOT']) / 'packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt').read_text()
          assert re.search(r'ndkVersion: String = "([^"]+)"', extension).group(1) == config['ndk']
          assert int(re.search(r'compileSdkVersion: Int = (\d+)', extension).group(1)) == config['platform']
          PY
      - name: Restore Flutter compilation outputs
        id: flutter-build-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .dart_tool/flutter_build
            build/app/intermediates/flutter/release
          key: flutter-build-android-${{ matrix.abi }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}-${{ github.sha }}
          restore-keys: flutter-build-android-${{ matrix.abi }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}-
      - name: Report Android compilation cache
        env:
          CACHE_HIT: ${{ steps.flutter-build-cache.outputs.cache-hit }}
        run: |
          echo "Flutter compilation exact cache hit: ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile Android APK
        id: build
        env:
          TARGET: ${{ matrix.target }}
        run: flutter build apk --release --split-per-abi --target-platform "$TARGET" --no-pub
      - name: Save Flutter compilation outputs before packaging
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.flutter-build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            .dart_tool/flutter_build
            build/app/intermediates/flutter/release
          key: ${{ steps.flutter-build-cache.outputs.cache-primary-key }}
      - name: Verify and collect the Android package
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          ABI: ${{ matrix.abi }}
          NOTICES_ABI: ${{ needs.metadata.outputs.notices_abi }}
          ANDROID_BUILD_TOOLS: ${{ steps.toolchain.outputs.build-tools }}
        run: |
          apk="build/app/outputs/flutter-apk/app-$ABI-release.apk"
          "$ANDROID_BUILD_TOOLS/apksigner" verify "$apk"
          APK="$apk" python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile(os.environ['APK']) as apk:
              abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
          if abis != {os.environ['ABI']}:
              raise SystemExit(f'Unexpected APK architectures: {abis}')
          PY
          mkdir -p build/release
          cp "$apk" "build/release/twist-cast-$VERSION-android-$ABI.apk"
          if [[ "$ABI" == "$NOTICES_ABI" ]]; then python3 tool/release.py notices; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ matrix.abi }}-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove the signing key
        if: always()
        run: rm -f "$TWISTCAST_KEYSTORE_PATH"

  macos:
    needs: metadata
    if: needs.metadata.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      FLUTTER_MACOS_ARM64_ONLY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Identify macOS build inputs
        id: macos-inputs
        run: python3 tool/release.py macos-input-key >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/flutter
        with:
          version: ${{ env.FLUTTER_VERSION }}
          platform: macos
          write-cache: 'true'
      - name: Identify the Xcode toolchain
        id: xcode
        run: echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
      - name: Check macOS update signing configuration
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          test -n "$SPARKLE_PRIVATE_KEY" || { echo 'Configure SPARKLE_PRIVATE_KEY before building macOS updates.'; exit 1; }
          swift tool/update_signing.swift verify-key
      - name: Restore Swift packages
        id: swift-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/macos/SourcePackages
          key: macos-spm-v2-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('pubspec.lock', 'packages/flutter_webrtc/macos/**/Package.swift', 'macos/Runner.xcodeproj/project.pbxproj', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          # SwiftPM validates the current dependency graph after restoring downloaded packages.
          restore-keys: macos-spm-v2-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-
      - name: Restore native compilation outputs
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/macos/Build
            build/macos/ModuleCache.noindex
            build/macos/SDKStatCaches.noindex
            .dart_tool/flutter_build
          key: macos-build-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'packages/flutter_webrtc/macos/**/Package.swift', 'macos/Runner.xcodeproj/project.pbxproj', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ steps.macos-inputs.outputs.key }}
          restore-keys: macos-build-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'packages/flutter_webrtc/macos/**/Package.swift', 'macos/Runner.xcodeproj/project.pbxproj', 'macos/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - name: Report macOS compilation caches
        env:
          SWIFT_HIT: ${{ steps.swift-cache.outputs.cache-hit }}
          NATIVE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
          SWIFT_KEY: ${{ steps.swift-cache.outputs.cache-matched-key }}
          NATIVE_KEY: ${{ steps.native-cache.outputs.cache-matched-key }}
        run: |
          echo "Swift package exact cache hit: ${SWIFT_HIT:-false}; native compilation exact cache hit: ${NATIVE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
          echo "Restored Swift packages: ${SWIFT_KEY:-none}; restored native outputs: ${NATIVE_KEY:-none}" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore timestamps of unchanged build inputs
        run: python3 tool/release.py restore-input-times
      - name: Compile macOS application
        id: build
        run: flutter build macos --release --no-pub
      - name: Save resolved Swift packages
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' && steps.swift-cache.outcome == 'success' && steps.swift-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            build/macos/SourcePackages
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}
      - name: Record successful build input timestamps
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        run: python3 tool/release.py save-input-times
      - name: Save native compilation outputs before packaging
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.native-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            build/macos/Build
            build/macos/ModuleCache.noindex
            build/macos/SDKStatCaches.noindex
            .dart_tool/flutter_build
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify and package the universal macOS application
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          app=build/macos/Build/Products/Release/TwistCast.app
          lipo "$app/Contents/MacOS/TwistCast" -verify_arch arm64 x86_64
          test -f "$app/Contents/Frameworks/Sparkle.framework/Sparkle"
          codesign --verify --deep --strict --verbose=2 "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$VERSION"
          mkdir -p build/dmg build/release
          ditto "$app" build/dmg/TwistCast.app
          ln -s /Applications build/dmg/Applications
          python3 tool/release.py notices
          unzip -q build/release/THIRD_PARTY_NOTICES.zip -d build/dmg/Licenses
          rm build/release/THIRD_PARTY_NOTICES.zip
          hdiutil create -volname TwistCast -srcfolder build/dmg -ov -format UDZO "build/release/twist-cast-$VERSION-macos-universal.dmg"
      - name: Sign the macOS update and write its feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 tool/release.py appcast
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release
          path: |
            build/release/*.dmg
            build/release/appcast.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [metadata, checks, android, macos]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.metadata.outputs.tag }}
      VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Recheck release eligibility before publishing
        id: release-policy
        env:
          PUBLISH_REQUESTED: 'true'
        run: python3 tool/release.py release-policy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.release-policy.outputs.publish == 'true'
        with:
          pattern: '*-release'
          path: build/release
          merge-multiple: true
      - name: Check the complete asset set and write checksums
        if: steps.release-policy.outputs.publish == 'true'
        run: |
          test -f "build/release/twist-cast-$VERSION-macos-universal.dmg"
          test -f build/release/appcast.xml
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "build/release/twist-cast-$VERSION-android-$abi.apk"
          done
          test -f build/release/THIRD_PARTY_NOTICES.zip
          python3 tool/release.py checksums
      - name: Publish the complete release
        if: steps.release-policy.outputs.publish == 'true'
        run: |
          cat > build/release-notes.md <<'NOTES'
          Native one-to-one phone screen sharing over a local network, with encrypted pairing and optional internal audio.

          - Android phones: download `android-arm64-v8a.apk` for most current phones. ARMv7 and x86_64 packages are also provided.
          - macOS: download `macos-universal.dmg` and drag TwistCast to Applications. Supports Apple Silicon and Intel Macs. This build is ad-hoc signed and is not notarized; macOS may require approval in System Settings > Privacy & Security.
          - Android release packages use a dedicated signing key. An existing debug-signed installation must be uninstalled first; uninstalling removes its local pairing data. Later releases retain the same release key for in-place updates.
          - These are early testing builds. Real-device capture, internal audio, and cross-device operation still need verification.
          - Checksums and third-party notices are included. iOS, Windows, and Linux packages are not included in this release workflow.
          NOTES
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'This version is already published; keeping workflow artifacts.'; exit 0; }
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "TwistCast $VERSION" --notes-file build/release-notes.md
          fi
          gh release upload "$TAG" build/release/* --clobber
          gh release edit "$TAG" --draft=false --notes-file build/release-notes.md

  timings:
    needs: [metadata, checks, android-toolchain, android, macos, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Report job and step durations
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" | python3 tool/release.py timings >> "$GITHUB_STEP_SUMMARY"
