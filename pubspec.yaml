name: twist_cast
description: "Private screen sharing across your devices."
publish_to: 'none'
version: 0.1.3+4

environment:
  sdk: ^3.14.0

dependencies:
  basic_utils: ^5.8.2
  bonsoir: ^7.1.6
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_webrtc:
    path: packages/flutter_webrtc
  intl: ^0.20.3
  material_ui: ^1.1.0
  mobile_scanner: ^7.5.0
  nanoid: ^1.0.0
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
